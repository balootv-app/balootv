# Claves y ajustes de BalooTV. Copia este fichero a local.properties (o genéralo con scripts/balootv/local_properties.py)
# y rellénalo. local.properties no entra en Git.

# TMDB (carteles y fichas): clave de API v3 propia (themoviedb.org → Ajustes → API). Es una cadena de 32 caracteres
# hexadecimales, por ejemplo: TMDB_API_KEY=<tu clave de 32 caracteres>
TMDB_API_KEY=
# La edición pública usa su propia clave (nunca cae en la de arriba al compilar la release).
TMDB_API_KEY_PUBLICA=

# Trakt: aplicación propia (trakt.tv/oauth/applications) con redirect urn:ietf:wg:oauth:2.0:oob. Pega solo el Client ID.
# Sin él, Trakt no funciona, pero la app compila.
TRAKT_CLIENT_ID=
TRAKT_REDIRECT_URI=urn:ietf:wg:oauth:2.0:oob
# Opcional: otro Client ID solo para la edición pública. Vacío, la pública usa TRAKT_CLIENT_ID.
TRAKT_CLIENT_ID_PUBLICA=

# Saltar intros y resúmenes (IntroDB).
INTRODB_API_URL=https://api.introdb.app/

# Firma de las versiones release (las debug no la necesitan): almacén de claves, alias y contraseñas.
# Crea el almacén con keytool. Ejemplo: BALOOTV_RELEASE_STORE_FILE=C:/ruta/a/mi-clave.jks y BALOOTV_RELEASE_KEY_ALIAS=mi-alias
BALOOTV_RELEASE_STORE_FILE=
BALOOTV_RELEASE_KEY_ALIAS=
BALOOTV_RELEASE_STORE_PASSWORD=
BALOOTV_RELEASE_KEY_PASSWORD=

# Solo la edición casa usa TORBOX_API_KEY, TRAKT_CLIENT_SECRET y %USERPROFILE%/.balootv/fuentes-casa.txt
# (las fuentes de casa, fuera de Git); la edición pública no las necesita.
# Su applicationId sale de %USERPROFILE%/.balootv/casa.properties (paquete=...); sin él, app.balootv.tv.casa.

# Optional: set to true only if you want to build the local ffmpeg-decoder-downmix module
USE_LOCAL_FFMPEG_DECODER=false
# Required only when USE_LOCAL_FFMPEG_DECODER=true
FFMPEG_SOURCE_DIR=path_to_ffmpeg_source_tree
FFMPEG_BUILD_DIR=path_to_ffmpeg_build_root

# --- DV7 / libdovi (Dolby Vision Profile 7 to 8.1) ---

# Build the dovi_bridge native lib + load the runtime bridge.
DOVI_NATIVE_ENABLED=true

# Marks extractor hook integration as available in the current build.
DOVI_EXTRACTOR_HOOK_READY=true

# Link the prebuilt libdovi static archive into dovi_bridge.
DOVI_ENABLE_REAL_LINK=true
# Optional explicit overrides (otherwise resolved from the prebuilt root below):
# DOVI_LIBDOVI_STATIC_LIB=/path/to/libdovi.a
# DOVI_LIBDOVI_INCLUDE_DIR=/path/to/libdovi/include
DOVI_LIBDOVI_PREBUILT_ROOT=DV7/libdovi
